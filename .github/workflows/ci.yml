name: CI

# Validation only. Pushes to master are covered by publish.yml, which builds
# before it pushes -- running this on push too just built everything twice.
on:
  pull_request:
    branches: [ master ]
    paths:
      - 'Dockerfile'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=latest
          cache-to: type=gha,mode=max,scope=latest

  automerge:
    if: github.actor == 'dependabot[bot]'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve PR
        if: steps.meta.outputs.package-ecosystem == 'docker' && contains(steps.meta.outputs.dependency-names, 'caddy')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr comment "$PR_URL" --body "Auto-approving Dependabot Docker digest update."
      - name: Enable auto-merge
        if: steps.meta.outputs.package-ecosystem == 'docker' && contains(steps.meta.outputs.dependency-names, 'caddy')
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.MERGE_GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
