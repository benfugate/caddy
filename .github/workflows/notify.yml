name: Notify on failure

on:
  workflow_run:
    workflows: [ "CI", "Build and Push Docker Images" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  discord:
    # Covers hard failures and hung runs. Cancelled runs are deliberately
    # excluded: those are almost always user-initiated.
    if: contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK is empty. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          jq -n \
            --arg name "$RUN_NAME" \
            --arg url "$RUN_URL" \
            --arg branch "$BRANCH" \
            --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            '{
              username: "GitHub Actions",
              embeds: [{
                title: ("❌ " + $name + " failed"),
                url: $url,
                color: 15548997,
                fields: [
                  { name: "Repo",    value: $repo,   inline: true },
                  { name: "Branch",  value: $branch, inline: true },
                  { name: "Commit",  value: $sha,    inline: true },
                  { name: "Actor",   value: $actor,  inline: true }
                ]
              }]
            }' > payload.json
          curl -sS -f -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$WEBHOOK"
