name: Notify on failure

on:
  workflow_run:
    workflows: [ "CI", "Build and Push Docker Images" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  ntfy:
    # Covers hard failures and hung runs. Cancelled runs are deliberately
    # excluded: those are almost always user-initiated.
    if: contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Post failure to ntfy
        env:
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$NTFY_TOKEN" ]; then
            echo "::error::NTFY_TOKEN is empty. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf 'Repo: %s\nBranch: %s\nCommit: %s\nActor: %s\n' \
            "$REPO" "$BRANCH" "${SHA:0:7}" "$ACTOR" > message.txt
          curl -sS -f -X POST \
            -H "Authorization: Bearer $NTFY_TOKEN" \
            -H "Title: $RUN_NAME failed" \
            -H "Tags: x,github" \
            -H "Click: $RUN_URL" \
            --data-binary @message.txt \
            https://ntfy.fugate.co/homelab
